<!DOCTYPE html>
<html>
<head>
	<title>Starting System</title>
	<meta http-equiv="refresh" content="20;url=http://127.0.0.1:8086">
	<style>
		body {
			margin: 0;
			background: black;
			overflow: hidden;
			font-family: Arial, sans-serif;
		}

		video {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 40%;
			height: auto;
			transform: translate(-50%, -50%);
		}
	
		.overlay {
			position: absolute;
			bottom: 40px;
			width: 100%;
			text-align: center;
			color: white;
			font-size: 2.5rem;
			opacity: 0.85;
		}
	</style>
</head>
<body>
	<video controls autoplay muted loop playsinline>
		<source src="runninganimation.mp4" type="video/mp4">
	</video>

	<div class="overlay">Starting System...</div>
</body>
</html>
